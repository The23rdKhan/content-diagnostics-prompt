services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: contentdiag-postgres
    environment:
      POSTGRES_DB: contentdiagnostics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contentdiagnostics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LocalStack for AWS services (S3, SQS)
  localstack:
    image: localstack/localstack:3.0
    container_name: contentdiag-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs
      - DEBUG=0
      - DATA_DIR=/var/lib/localstack/data
    volumes:
      - localstack_data:/var/lib/localstack
      - ./localstack-init:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contentdiag-api
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Database
      DB_URL: jdbc:postgresql://postgres:5432/contentdiagnostics
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

      # JWT
      JWT_SECRET: dev-secret-key-at-least-256-bits-long-for-hs256-algorithm-testing
      JWT_EXPIRATION_MS: 3600000
      JWT_REFRESH_EXPIRATION_MS: 604800000

      # AWS (LocalStack)
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET_NAME: content-diagnostics-uploads
      S3_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/content-diagnostics-queue

      # Stripe (test mode - use your own test keys from https://dashboard.stripe.com/test/apikeys)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Create products/prices in Stripe Dashboard or via CLI, then add IDs here
      STRIPE_PRICE_BASIC: ${STRIPE_PRICE_BASIC:-}
      STRIPE_PRICE_PROFESSIONAL: ${STRIPE_PRICE_PROFESSIONAL:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}

      # Resend (optional)
      RESEND_API_KEY: ${RESEND_API_KEY:-}

      # Spring profiles
      SPRING_PROFILES_ACTIVE: dev
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Stripe CLI for webhook forwarding (requires STRIPE_SECRET_KEY)
  stripe-cli:
    image: stripe/stripe-cli:latest
    container_name: contentdiag-stripe
    profiles:
      - stripe
    depends_on:
      - app
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_DEVICE_NAME: contentdiag-docker
    command: listen --forward-to http://app:8080/api/webhooks/stripe --skip-verify
    restart: on-failure
    # The webhook signing secret will be printed in the logs
    # Use: docker logs contentdiag-stripe to see it

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: contentdiag-pgadmin
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@contentdiag.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  localstack_data:
