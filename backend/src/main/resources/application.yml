spring:
  application:
    name: content-diagnostics-api

  # Database Configuration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/contentdiagnostics}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-for-development-only-change-in-prod}
  issuer: ${JWT_ISSUER:content-diagnostics}
  access-token-expiration-ms: 900000  # 15 minutes
  refresh-token-expiration-ms: 604800000  # 7 days

# AWS Configuration
aws:
  region: ${AWS_REGION:us-east-1}
  s3:
    bucket: ${S3_BUCKET:content-diagnostics-uploads}
    presign-expiration-minutes: 60
  sqs:
    video-processing-queue: ${SQS_VIDEO_PROCESSING_QUEUE:}
    segmentation-queue: ${SQS_SEGMENTATION_QUEUE:}
    qc-queue: ${SQS_QC_QUEUE:}
    report-compilation-queue: ${SQS_REPORT_COMPILATION_QUEUE:}
    notification-queue: ${SQS_NOTIFICATION_QUEUE:}
    email-queue: ${SQS_EMAIL_QUEUE:}

# Stripe Configuration
stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  price-ids:
    basic: ${STRIPE_PRICE_BASIC:}
    professional: ${STRIPE_PRICE_PROFESSIONAL:}
    enterprise: ${STRIPE_PRICE_ENTERPRISE:}

# Resend Configuration
resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:noreply@contentdiagnostics.com}

# PostHog Configuration (optional)
posthog:
  api-key: ${POSTHOG_API_KEY:}
  host: ${POSTHOG_HOST:https://app.posthog.com}

# Sentry Configuration (optional)
sentry:
  dsn: ${SENTRY_DSN:}

# Application-specific Configuration
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  task:
    lease-duration-minutes: 10
    min-watch-ratio: 0.70
    min-completion-time-seconds: 30
    default-pay-amount: 0.30
  payout:
    minimum-amount: 10.0
  reviewer:
    initial-quality-score: 100
    lock-threshold: 60
    score-decrease-on-reject: 5
    score-increase-on-approve: 1
  qualification:
    min-completion-time-seconds: 60
    passing-threshold: 0.80
    max-attempts: 3
    retry-cooldown-hours: 24
    # Sample qualification test questions
    questions:
      - id: q1
        text: "What should you do if you see inappropriate or offensive content in a video?"
        options:
          - "Ignore it and continue reviewing"
          - "Flag and report the content immediately"
          - "Give the video a low rating without reporting"
          - "Stop reviewing and wait for instructions"
        answer: "Flag and report the content immediately"
      - id: q2
        text: "What is the minimum amount of time you should watch a video segment before rating it?"
        options:
          - "10 seconds"
          - "30 seconds"
          - "1 minute"
          - "The entire video"
        answer: "30 seconds"
      - id: q3
        text: "When providing feedback on a video, you should:"
        options:
          - "Only focus on negative aspects"
          - "Be vague to save time"
          - "Provide specific, constructive feedback"
          - "Copy feedback from previous reviews"
        answer: "Provide specific, constructive feedback"
      - id: q4
        text: "If you cannot complete a task within the time limit, what should you do?"
        options:
          - "Submit incomplete work"
          - "Let the task expire so it returns to the queue"
          - "Ask another reviewer to help"
          - "Extend the time limit yourself"
        answer: "Let the task expire so it returns to the queue"
      - id: q5
        text: "What is the most important quality in a video review?"
        options:
          - "Speed of completion"
          - "Accuracy and honesty"
          - "Giving high ratings to all videos"
          - "Matching other reviewers' opinions"
        answer: "Accuracy and honesty"
  cookie:
    # HttpOnly cookie settings for refresh tokens
    secure: ${COOKIE_SECURE:false}  # true in production (HTTPS only)
    same-site: ${COOKIE_SAME_SITE:Lax}  # CSRF protection
    max-age-seconds: 604800  # 7 days, matches refresh token expiration
  debug-tools:
    enabled: ${DEBUG_TOOLS_ENABLED:false}
  rate-limit:
    login-attempts-per-minute: 5
    signup-attempts-per-minute: 3
    password-reset-per-hour: 3
  encryption:
    # Base64-encoded 256-bit (32 byte) key for encrypting sensitive data
    # Generate with: openssl rand -base64 32
    key: ${ENCRYPTION_KEY:}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# OpenAPI/Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false

# App info (for OpenAPI)
info:
  app:
    name: Content Diagnostics API
    version: 1.0.0
    description: Platform for video content review and diagnostics

# Logging
logging:
  level:
    root: INFO
    com.contentdiagnostics: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"

---
# Test profile
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
