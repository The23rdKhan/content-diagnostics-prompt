# Production Profile Configuration
# Activate with: SPRING_PROFILES_ACTIVE=prod

spring:
  config:
    activate:
      on-profile: prod

  # Database - use environment variables
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  # Disable Flyway auto-migrate in prod (run migrations manually)
  flyway:
    enabled: ${FLYWAY_ENABLED:false}

# Server Configuration
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

# JWT - must use secure secret in production
jwt:
  secret: ${JWT_SECRET}

# Application Configuration
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://contentdiagnostics.com,https://www.contentdiagnostics.com}
  cookie:
    secure: true  # HTTPS only
    same-site: Strict  # Stricter CSRF protection
  debug-tools:
    enabled: false

# Disable Swagger in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Production logging
logging:
  level:
    root: WARN
    com.contentdiagnostics: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
